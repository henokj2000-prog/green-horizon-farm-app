function assetDisposal(a){
  if(!a.disposedDate || !a.dateAcquired || !num(a.cost)) return null;
  const fy = efyOf(a.disposedDate), cost = num(a.cost), acc = assetDepFor(a, fy).acc, proceeds = num(a.disposalProceeds);
  return {fy, cost, acc, nbv:cost-acc, proceeds, gl:proceeds-(cost-acc)};
}
function acctFirstFY(){
  let m = null;
  const upd = d => { if(!validDate(d)) return; const y = efyOf(d); if(m===null || y<m) m = y; };
  state.income.forEach(r=>upd(r.date)); state.expenses.forEach(r=>upd(r.date)); state.payments.forEach(r=>upd(r.date));
  state.assets.forEach(a=>upd(a.dateAcquired));
  bioBatches().forEach(b=>upd(b.dateAcquired));
  state.acct.forEach(x=>{ if(!isOpeningType(x.type)) upd(x.date); });
  state.feedPurchases.forEach(f=>upd(f.date)); state.feeding.forEach(f=>upd(f.date)); state.vaccinations.forEach(f=>upd(f.date)); state.medications.forEach(f=>upd(f.date)); state.livestock.forEach(b=>upd(b.dateAcquired));
  return m===null ? currentEFY() : m;
}


/* ================= BIOLOGICAL ASSETS (cost model) =================
   Layer flocks (Poultry batches switched to "Track as layer flock"):
     1. Bought before laying age -> 1600 Immature layers (asset, not an expense).
     2. Feed used, vaccines, medication and labour for the flock while under laying age are capitalised into 1600.
     3. At laying age the balance of 1600 is locked and moved to 1610 Mature layers.
     4. It is amortised straight-line over 12-18 months to 6110.
   Goats, sheep and oxen are assets too (1650, optional amortisation to 6120).
   Whenever animals leave a batch (any reduction, or a sale recorded in Income) their per-head carrying value is
   removed: deaths -> mortality expense, other exits -> carrying value written off. Sale proceeds stay in Income.
   Bees and non-layer poultry are expensed at purchase (cost of production). */
const BIO_YES = 'Yes';
const ASSET_ANIMALS = ['Goats','Sheep','Oxen'];
/* Only these costs may be capitalised into an immature layer flock (when user links a batch + Auto).
   Labor, Utilities, Rent, Transport etc. are always operating expenses on the P&L. */
const REARING_CATS = ['Feed Used','Vaccination','Medication'];
const AUTO_COST_CATS = ['Feed Purchase','Feed Used','Vaccination','Medication','Livestock Purchase'];   // created automatically, never typed into Expenses
const ALWAYS_OPEX_CATS = ['Labor','Utilities','Equipment','Transport','Rent','Other Expense','Other'];
const DEFAULT_LAYING_AGE_WEEKS = 22;   // ~5 months — typical onset of lay
const DEFAULT_AMORT_MONTHS = 18;
const FEED_PERIODS = [
  {value:'Day', days:1, label:'Day'},
  {value:'Week', days:7, label:'Week'},
  {value:'Bi-week', days:14, label:'Bi-week (2 weeks)'},
  {value:'Month', days:30, label:'Month'}
];
function feedPeriodDays(p){ const x = FEED_PERIODS.find(f=>f.value===p); return x ? x.days : 1; }
function money2(x){ return Math.round(x*100)/100; }
function addMonthsISO(iso, m){
  const p = iso.split('-').map(Number), idx = p[0]*12 + (p[1]-1) + m;
  const y = Math.floor(idx/12), mo = idx - y*12;
  const dim = new Date(Date.UTC(y, mo+1, 0)).getUTCDate();
  return String(y).padStart(4,'0')+'-'+String(mo+1).padStart(2,'0')+'-'+String(Math.min(p[2],dim)).padStart(2,'0');
}
function addDaysISO(iso, days){
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+days);
  const y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
/** Bird age helpers (weeks). Old records stored months — convert ×4.345. */
function weeksAtPurchase(b){
  if(num(b.ageWeeksAtPurchase)>0) return Math.round(num(b.ageWeeksAtPurchase));
  if(num(b.ageMonthsAtPurchase)>0) return Math.round(num(b.ageMonthsAtPurchase)*4.345);
  return 0;
}
function layingAgeWeeksOf(b){
  if(num(b.layingAgeWeeks)>0) return Math.round(num(b.layingAgeWeeks));
  if(num(b.layingAgeMonths)>0) return Math.round(num(b.layingAgeMonths)*4.345);
  return DEFAULT_LAYING_AGE_WEEKS;
}
function isLayerFlock(b){ return !!b && b.bio===BIO_YES && b.animalType==='Poultry'; }
function isAssetAnimal(b){ return !!b && ASSET_ANIMALS.includes(b.animalType); }
function isBioBatch(b){ return isLayerFlock(b) || isAssetAnimal(b); }
function bioBatches(){ return state.livestock.filter(isBioBatch); }
function layerBatchById(id){ return id ? (state.livestock.find(b=>b.batchId===id && isLayerFlock(b)) || null) : null; }
function bioBatchOptions(){ return state.livestock.filter(isLayerFlock).map(b=>({value:b.batchId, label:`${b.batchId} — ${b.breed||b.animalType}`})); }
function bioAccts(b){
  return isLayerFlock(b) ? {imm:'1600', cost:'1610', acc:'1620', amort:'6110', mort:'6400', wo:'6410', grp:'L'}
                         : {imm:'1600', cost:'1650', acc:'1660', amort:'6120', mort:'6420', wo:'6430', grp:'O'};
}
function bioParams(b){
  if(isLayerFlock(b)){
    const layW = layingAgeWeeksOf(b);
    // When policy is 'cost', force amortisation to 0 so statements hold layers at cost until disposal
    let am = num(b.amortMonths)>0 ? Math.round(num(b.amortMonths)) : DEFAULT_AMORT_MONTHS;
    if(bioPolicy==='cost') am = 0;
    const age0w = Math.max(0, weeksAtPurchase(b));
    const born = validDate(b.dateAcquired) ? addDaysISO(b.dateAcquired, -age0w*7) : null;
    return {lay:layW, layW, am, age0:age0w, age0w, born, mature: born ? addDaysISO(born, layW*7) : null};
  }
  let amO = Math.max(0, Math.round(num(b.amortMonthsOther)));
  if(bioPolicy==='cost') amO = 0;
  return {lay:0, layW:0, am: amO, age0:0, age0w:0, born:b.dateAcquired, mature: validDate(b.dateAcquired) ? b.dateAcquired : null};
}
/* Is this cost eligible to be capitalised into a layer flock that is still under laying age? */
function expEligibleBatch(r){
  if(!r) return null;
  if(ALWAYS_OPEX_CATS.includes(r.category)) return null;           // never capitalise pure operating costs
  if(r.capMode==='No') return null;
  const b = layerBatchById(r.batchId); if(!b) return null;
  if(!REARING_CATS.includes(r.category)) return null;
  if(!validDate(r.date) || !validDate(b.dateAcquired)) return null;
  const P = bioParams(b);
  if(!(P.mature > b.dateAcquired)) return null;                    // flock was already laying when acquired
  if(r.date < b.dateAcquired || r.date >= P.mature) return null;   // outside the rearing window
  return b;
}
/* The is_capitalized switch: true only while the cost is still eligible, so a stale flag can never strand a balance */
function expCapBatch(r){ return r.isCapitalized===true ? expEligibleBatch(r) : null; }
async function refreshCapFlags(){
  let changed = false;
  state.expenses.forEach(r=>{
    const want = r.capMode==='No' ? false : !!expEligibleBatch(r);
    if(!!r.isCapitalized !== want){ r.isCapitalized = want; changed = true; }
  });
  if(changed) await saveEntity('expenses');
}

/* ---- every cost of the farm as one list: typed expenses + costs created automatically by other records ---- */
function payFromFund(fb){ fb = fb || ''; if(fb.indexOf('Supplier credit')===0) return PAY_UNPAID; if(fb.indexOf('Contributed')===0) return PAY_OWNER; return PAY_PAID; }
function costRows(){
  const rows = state.expenses.map(r=>Object.assign({}, r, {derived:false}));
  const push = r => { r.derived = true; r.isCapitalized = r.capMode==='No' ? false : !!expEligibleBatch(r); rows.push(r); };
  state.vaccinations.forEach(v=>{ if(num(v.cost)>0) push({id:'vax:'+v.id, srcEntity:'vaccinations', srcId:v.id, date:v.date, category:'Vaccination', description:'Vaccination — '+(v.vaccine||''), amount:num(v.cost), payStatus:v.payStatus||PAY_PAID, batchId:v.batchId, capMode:'Auto', origin:'Health tab'}); });
  state.medications.forEach(m=>{ if(num(m.cost)>0) push({id:'med:'+m.id, srcEntity:'medications', srcId:m.id, date:m.date, category:'Medication', description:'Medication — '+(m.medication||''), amount:num(m.cost), payStatus:m.payStatus||PAY_PAID, batchId:m.batchId, capMode:'Auto', origin:'Health tab'}); });
  const fs = feedSim();
  state.feeding.forEach(f=>{ const c = fs.cost[f.id] || 0; if(c>0) push({id:'feed:'+f.id, srcEntity:'feeding', srcId:f.id, date:f.date, category:'Feed Used', description:'Feed used — '+f.feedType+' ('+fmtNum(f.qtyUsed)+' kg)', amount:c, credit:'1200', batchId:f.batchId, capMode:'Auto', origin:'Feeding log'}); });
  state.livestock.forEach(b=>{ if(!isBioBatch(b) && num(b.purchaseCost)>0 && validDate(b.dateAcquired) && String(b.fundedBy||'').indexOf('Owned before')!==0)
    push({id:'buy:'+b.id, srcEntity:'livestock', srcId:b.id, date:b.dateAcquired, category:'Livestock Purchase', description:'Purchase of '+(b.batchId||'')+' ('+(b.breed||b.animalType)+')', amount:num(b.purchaseCost), payStatus:payFromFund(b.fundedBy), batchId:'', capMode:'No', origin:'Livestock tab'}); });
  return rows;
}

/* Replays one batch's life event by event; returns the ledger entries it generates (the rearing costs are booked by buildJournal). */
function bioSim(b){
  const P = bioParams(b), AC = bioAccts(b), res = {P, AC, ok:false, entries:[], snaps:[], buy:null, locked:null, matDate:null, immAtBuy:false, final:null};
  if(!P.mature || !validDate(b.dateAcquired)) return res;
  const acq = b.dateAcquired, id = b.batchId || '';
  const immAtBuy = P.mature > acq, matDate = immAtBuy ? P.mature : acq;
  res.ok = true; res.immAtBuy = immAtBuy; res.matDate = matDate;
  const cost = money2(num(b.purchaseCost));
  const ev = [{date:acq, pri:0, type:'buy'}];
  costRows().forEach(r=>{ if(r.batchId===b.batchId && expCapBatch(r)===b) ev.push({date:r.date, pri:1, type:'cap', amt:money2(num(r.amount))}); });
  allReductions().forEach(r=>{ if(r.batchId===b.batchId && num(r.qty)>0) ev.push({date:(validDate(r.date)&&r.date>acq)?r.date:acq, pri:2, type:'red', r}); });
  if(immAtBuy) ev.push({date:matDate, pri:3, type:'mature'});
  for(let k=1;k<=P.am;k++) ev.push({date:addMonthsISO(matDate,k), pri:4, type:'amort', k});
  ev.sort((x,y)=> x.date<y.date ? -1 : x.date>y.date ? 1 : x.pri-y.pri);

  let I=0, G=0, A=0, Q=0, mature=!immAtBuy;
  ev.forEach(e=>{
    if(e.type==='buy'){
      Q = num(b.initialQty);
      if(cost>0){ if(mature) G = money2(G+cost); else I = money2(I+cost); }
      res.buy = {date:acq, acct: mature?AC.cost:AC.imm, amount:cost};
      if(mature) res.locked = {date:acq, cost:G};
    }
    else if(e.type==='cap'){ I = money2(I+e.amt); }
    else if(e.type==='red'){
      const q = Math.min(num(e.r.qty), Q); if(q<=0) return;
      const death = e.r.reason==='Death', ex = death ? AC.mort : AC.wo;
      let wo, lines, perHead;
      if(mature){
        const gS = money2(G*q/Q), aS = money2(A*q/Q);
        wo = money2(gS-aS); perHead = (G-A)/Q; G = money2(G-gS); A = money2(A-aS);
        lines = [[ex,wo],[AC.acc,aS],[AC.cost,-gS]];
      }else{
        wo = money2(I*q/Q); perHead = I/Q; I = money2(I-wo);
        lines = [[ex,wo],[AC.imm,-wo]];
      }
      Q -= q;
      const word = AC.grp==='L' ? 'bird(s)' : 'head';
      res.entries.push({date:e.date, kind: death?'bioMort':'bioWo', grp:AC.grp, wo, qty:q, redId:e.r.id, lines,
        desc:(death?'Mortality — ':(e.r.reason==='Sale'?'Sold — ':'Removed ('+String(e.r.reason||'other').toLowerCase()+') — '))+id+': '+q+' '+word+' × '+fmtMoney(perHead)+' carrying value'});
    }
    else if(e.type==='mature'){
      const amt = I;
      G = money2(G+I); I = 0; mature = true; res.locked = {date:e.date, cost:G};
      if(amt>0) res.entries.push({date:e.date, kind:'bioMature', grp:AC.grp, lines:[[AC.cost,amt],[AC.imm,-amt]],
        desc:'Flock '+id+' reached laying age — rearing cost locked and moved to mature layers'});
    }
    else if(e.type==='amort'){
      if(!mature) return;
      const nbv = money2(G-A), rem = P.am - e.k + 1;
      const ch = e.k===P.am ? nbv : money2(nbv/rem);
      if(ch>0){ A = money2(A+ch); res.entries.push({date:e.date, kind:'bioAmort', grp:AC.grp, amt:ch, lines:[[AC.amort,ch],[AC.acc,-ch]],
        desc:'Amortisation '+e.k+' of '+P.am+' — '+id}); }
    }
    res.snaps.push({date:e.date, I, G, A, Q});
  });
  res.final = {I, G, A, Q};
  return res;
}
function bioAll(){ return bioBatches().map(b=>({b, s:bioSim(b)})); }
function bioSnapAt(s, d){ let cur = {I:0, G:0, A:0, Q:0}; s.snaps.forEach(x=>{ if(x.date<=d) cur = x; }); return cur; }
/* every P&L charge produced by the animals: amortisation, mortality, write-off of animals that left */
function bioCharges(){
  const out = [];
  bioAll().forEach(({b,s})=>s.entries.forEach(e=>{
    const L = e.grp==='L';
    if(e.kind==='bioAmort') out.push({date:e.date, kind:e.kind, grp:e.grp, cat:L?'Amortisation of mature layers':'Amortisation of other livestock', amt:e.amt, batchId:b.batchId, desc:e.desc});
    else if(e.kind==='bioMort' || e.kind==='bioWo') out.push({date:e.date, kind:e.kind, grp:e.grp, cat:e.kind==='bioMort'?(L?'Poultry Mortality':'Livestock Mortality'):(L?'Poultry write-off (sold / culled / lost)':'Livestock write-off (sold / culled / lost)'), amt:e.wo, batchId:b.batchId, desc:e.desc, qty:e.qty, redId:e.redId});
  }));
  return out;
}
function bioFY(efy){
  const o = {amortL:0, amortO:0, mortL:0, mortO:0, woL:0, woO:0};
  bioCharges().forEach(c=>{ if(!inFY(c.date,efy)) return; const k = (c.kind==='bioAmort'?'amort':c.kind==='bioMort'?'mort':'wo')+c.grp; o[k] += c.amt; });
  o.amort = o.amortL + o.amortO; o.mort = o.mortL + o.mortO; o.wo = o.woL + o.woO;
  return o;
}
function bioWriteOffByReduction(){ const m = {}; bioCharges().forEach(c=>{ if(c.redId) m[c.redId] = (m[c.redId]||0) + c.amt; }); return m; }

function renderBioAssets(){
  const today = todayISO(), all = bioAll();
  const body = all.length ? all.map(({b,s})=>{
    if(!s.ok) return `<tr><td class="mono">${escHtml(b.batchId)}</td><td colspan="10" style="color:var(--clay)">Check this batch: it needs a valid acquisition date.</td></tr>`;
    const pos = bioSnapAt(s, today), P = s.P, L = s.AC.grp==='L';
    const done = s.entries.filter(e=>e.kind==='bioAmort' && e.date<=today).length;
    const isMature = today >= s.matDate;
    let status;
    if(!isMature) status = 'Rearing (immature)';
    else if(P.am===0) status = 'Held at cost';
    else status = (done>=P.am || ((pos.G-pos.A)<0.005 && done>0)) ? 'Fully amortised' : (L ? 'Laying — amortising' : 'Amortising');
    const nbv = pos.I + pos.G - pos.A, rem = P.am - done;
    const next = (isMature && rem>0 && P.am>0) ? money2((pos.G-pos.A)/rem) : 0;
    return `<tr><td class="mono">${escHtml(b.batchId)}</td><td>${escHtml(b.animalType)}</td><td>${status}</td><td class="num mono">${fmtNum(pos.Q)}</td>
      <td>${fmtDate(s.matDate)}</td>
      <td class="num mono">${fmtMoney(pos.I)}</td><td class="num mono">${fmtMoney(pos.G)}</td><td class="num mono">${fmtMoney(-pos.A)}</td>
      <td class="num mono"><strong>${fmtMoney(nbv)}</strong></td><td class="num mono">${fmtMoney(next)}</td>
      <td class="num mono">${s.locked ? fmtMoney(s.locked.cost) : '—'}</td></tr>`;
  }).join('') : emptyRow(11,'No biological assets yet. Add a Poultry batch as a layer flock, or a Goats / Sheep / Oxen batch, in the Livestock tab.');
  return `
  <div class="pagehead" style="margin-top:26px"><div><h2 style="margin:0;font-family:'Space Grotesk',sans-serif">Biological assets — layer flocks, goats, sheep, oxen</h2>
  <p>Purchase price + rearing costs are held as an asset (layers are locked at laying age, then amortised). Figures are as at today (${today}).</p></div></div>
  <div class="panel"><div class="tablewrap"><table><thead><tr>
    <th>Batch</th><th>Type</th><th>Status</th><th class="num">Head</th><th>In service from</th>
    <th class="num">Immature (cost)</th><th class="num">Mature / in-service (cost)</th><th class="num">Accum. amortisation</th>
    <th class="num">Net book value</th><th class="num">Next monthly charge</th><th class="num">Cost locked</th>
  </tr></thead><tbody>${body}</tbody></table></div></div>
  <p class="note">Animals that die, are culled or are sold (recorded in Income) remove their per-head share of this value automatically. Deaths become mortality expense; sales still show their proceeds in Income. Bees and non-layer poultry are expensed when bought.</p>`;
}

function buildJournal(sel){
  _canon = {};
  const J = [], end = fyRange(sel)[1];
  const drcr = (a,amt,party)=> amt>=0 ? [a,amt,0,party] : [a,0,-amt,party];
  const add = (date,desc,src,kind,cf,lines)=>{
    lines = lines.filter(l=>Math.abs(l[1]||0)+Math.abs(l[2]||0)>1e-9);
    if(lines.length) J.push({date,desc,src,kind,cf,lines});
  };

  /* --- sales (gross invoice; VAT extracted when registered; revenue = net) --- */
  state.income.forEach(r=>{
    if(!validDate(r.date) || r.date>end) return;
    const gross = incomeGross(r), paid = incomePaidAmt(r), w = whtRecognisedOnSale(r);
    const vat = incomeVat(r), net = money2(gross - vat);
    add(r.date, 'Sale: '+(r.description||r.category||''), 'income', 'sale', 'op',
      [drcr('1000',paid-w), drcr('1150',w), drcr('1100',gross-paid), drcr('4000',-net), drcr('2210',-vat)]);
  });
  /* --- customer payments --- */
  state.payments.forEach(p=>{
    if(!validDate(p.date) || p.date>end) return;
    add(p.date, 'Customer payment: '+(customerName(p.customerId)||''), 'payment', 'collection', 'op',
      [drcr('1000',num(p.amount)), drcr('1100',-num(p.amount))]);
  });
  /* --- feed purchases: inventory asset until the feed is used --- */
  state.feedPurchases.forEach(r=>{
    if(!validDate(r.date) || r.date>end) return;
    const amt = money2(num(r.qty)*num(r.unitCost)), ps = r.payStatus || PAY_PAID;
    let credit, kind = 'feedBuy';
    if(ps.indexOf('Unpaid')===0) credit = drcr('2000',-amt);
    else if(ps.indexOf('Paid personally')===0){ credit = drcr('3000',-amt,partyName('')); kind = 'ownerPaidExp'; }
    else credit = drcr('1000',-amt);
    add(r.date, 'Feed purchased: '+(r.feedType||'')+(r.supplier?' — '+r.supplier:''), 'feed', kind, 'op', [drcr('1200',amt), credit]);
  });
  /* --- all costs: typed expenses + vaccinations, medication, feed used, livestock bought for expense --- */
  costRows().forEach(r=>{
    if(!validDate(r.date) || r.date>end) return;
    const amt = num(r.amount), cop = COST_OF_PRODUCTION_CATS.includes(r.category), ps = r.payStatus || PAY_PAID;
    const cb = expCapBatch(r), ref = r.derived ? 'Auto' : 'Expense';
    if(r.credit==='1200'){   // feed taken out of inventory
      if(cb) add(r.date, 'Feed capitalised into flock '+cb.batchId+': '+(r.description||''), 'expense', 'bioCapStock', null, [drcr('1600',amt), drcr('1200',-amt)]);
      else add(r.date, 'Feed used: '+(r.description||''), 'expense', 'feedUse', 'op', [drcr('5000',amt), drcr('1200',-amt)]);
      return;
    }
    if(cb){   // rearing cost of an immature flock -> asset, not P&L
      const ca = money2(amt);
      let cc2, ck = 'bioCap';
      if(ps.indexOf('Unpaid')===0){ cc2 = drcr('2000',-ca); ck = 'bioCapCredit'; }
      else if(ps.indexOf('Paid personally')===0){ cc2 = drcr('3000',-ca,partyName('')); ck = 'bioCapOwner'; }
      else cc2 = drcr('1000',-ca);
      add(r.date, 'Rearing cost capitalised ('+cb.batchId+'): '+(r.description||r.category||''), 'expense', ck, 'inv', [drcr('1600',ca), cc2]);
      return;
    }
    let credit, kind = 'expense';
    if(ps.indexOf('Unpaid')===0) credit = drcr('2000',-amt);
    else if(ps.indexOf('Paid personally')===0){ credit = drcr('3000',-amt,partyName('')); kind = 'ownerPaidExp'; }
    else credit = drcr('1000',-amt);
    add(r.date, ref+': '+(r.description||r.category||''), 'expense', kind, 'op', [drcr(cop?'5000':'6000',amt), credit]);
  });
  /* --- fixed assets --- */
  state.assets.forEach(a=>{
    const cost = num(a.cost);
    if(!cost || !validDate(a.dateAcquired) || a.dateAcquired>end) return;
    const fb = a.fundedBy || FUND_PAID, acqFY = efyOf(a.dateAcquired);
    let credit, date = a.dateAcquired, kind = 'asset';
    if(fb.indexOf('Supplier credit')===0){ credit = drcr('2050',-cost); kind = 'assetCredit'; }
    else if(fb.indexOf('Contributed')===0){ credit = drcr('3000',-cost,partyName('')); kind = 'assetInKind'; }
    else if(fb.indexOf('Owned before')===0){ credit = drcr('3000',-cost,partyName('')); date = OPEN_DATE; kind = 'assetOpen'; }
    else credit = drcr('1000',-cost);
    add(date, 'Asset acquired: '+(a.name||''), 'asset', kind, 'inv', [drcr('1500',cost), credit]);
    const lastFY = a.disposedDate ? Math.min(sel, efyOf(a.disposedDate)) : sel;
    for(let fy=acqFY; fy<=lastFY; fy++){
      const d = assetDepFor(a,fy).dep;
      add(fyRange(fy)[1], 'Depreciation '+fy+' EFY: '+(a.name||''), 'dep', 'dep', null, [drcr('6100',d), drcr('1510',-d)]);
    }
    const ds = assetDisposal(a);
    if(ds && a.disposedDate<=end){
      add(a.disposedDate, 'Asset disposed: '+(a.name||''), 'disposal', 'disposal', 'inv',
        [drcr('1000',ds.proceeds), drcr('1510',ds.acc), drcr('1500',-ds.cost), drcr('6900',-ds.gl)]);
    }
  });
  /* --- biological assets: layer flocks --- */
  bioAll().forEach(({b,s})=>{
    if(!s.ok) return;
    const bu = s.buy;
    if(bu && bu.amount>0 && bu.date<=end){
      const fb = b.fundedBy || FUND_PAID;
      let credit, date = bu.date, kind = 'bioBuy';
      if(fb.indexOf('Supplier credit')===0){ credit = drcr('2050',-bu.amount); kind = 'bioCredit'; }
      else if(fb.indexOf('Contributed')===0){ credit = drcr('3000',-bu.amount,partyName('')); kind = 'bioInKind'; }
      else if(fb.indexOf('Owned before')===0){ credit = drcr('3000',-bu.amount,partyName('')); date = OPEN_DATE; kind = 'bioOpen'; }
      else credit = drcr('1000',-bu.amount);
      add(date, 'Flock acquired: '+(b.batchId||''), 'bio', kind, 'inv', [drcr(bu.acct,bu.amount), credit]);
    }
    s.entries.forEach(e=>{ if(e.date>end) return; add(e.date, e.desc, 'bio', e.kind, null, e.lines.map(l=>drcr(l[0],l[1]))); });
  });
  /* --- accounting transactions (loans, capital, drawings ...) --- */
  state.acct.forEach(x=>{
    const amt = num(x.amount); if(!amt) return;
    const open = isOpeningType(x.type);
    if(!open && (!validDate(x.date) || x.date>end)) return;
    const d = open ? OPEN_DATE : x.date, p = partyName(x.party);
    switch(x.type){
      case AT.INV:   add(d,'Owner investment — '+p,'acct','inv','fin',[drcr('1000',amt),drcr('3000',-amt,p)]); break;
      case AT.SALE:  add(d,'Sale of ownership to '+p,'acct','saleown','fin',[drcr('1000',amt),drcr('3000',-amt,p)]); break;
      case AT.XFER:  add(d,'Ownership transfer '+partyName(x.fromParty)+' → '+p,'acct','xfer',null,[drcr('3000',amt,partyName(x.fromParty)),drcr('3000',-amt,p)]); break;
      case AT.DRAW:  add(d,'Owner drawing — '+p,'acct','draw','fin',[drcr('3100',amt,p),drcr('1000',-amt)]); break;
      case AT.LOAN:  add(d,'Loan received — '+lenderName(x),'acct','loan','fin',[drcr('1000',amt),drcr(loanAcctFor(x),-amt)]); break;
      case AT.REPAY: add(d,'Loan repayment — '+lenderName(x),'acct','repay','fin',[drcr(loanAcctFor(x),amt),drcr('1000',-amt)]); break;
      case AT.INT:   add(d,'Loan interest paid'+(String(x.party||'').trim()?' — '+lenderName(x):''),'acct','int','op',[drcr('6200',amt),drcr('1000',-amt)]); break;
      case AT.SUPP:  add(d,'Payment to supplier'+(String(x.party||'').trim()?' — '+String(x.party).trim():''),'acct','supp','op',[drcr('2000',amt),drcr('1000',-amt)]); break;
      case AT.ASUPP: add(d,'Payment to asset supplier'+(String(x.party||'').trim()?' — '+String(x.party).trim():''),'acct','asupp','inv',[drcr('2050',amt),drcr('1000',-amt)]); break;
      case AT.TAX:   add(d,'Income tax paid','acct','taxpaid','op',[drcr('2300',amt),drcr('1000',-amt)]); break;
      case AT.OINC:  add(d,'Other income received','acct','oinc','op',[drcr('1000',amt),drcr('4900',-amt)]); break;
      case AT.OPCASH:add(d,'Opening cash & bank — '+p,'acct','opcash','open',[drcr('1000',amt),drcr('3000',-amt,p)]); break;
      case AT.OPLOAN:add(d,'Opening loan owed — '+lenderName(x),'acct','oploan','open',[drcr('3000',amt,partyName('')),drcr(loanAcctFor(x),-amt)]); break;
    }
  });
  /* --- fiscal-year-end entries: produce inventory, manual adjustments, tax --- */
  const first = Math.min(acctFirstFY(), sel);
  for(let fy=first; fy<=sel; fy++){
    const fe = fyRange(fy)[1], adj = taxAdj(fy), rep = fyReport(fy);
    const pch = produceChangeInFY(fy);
    if(Math.abs(pch)>0.005) add(fe,'Change in agricultural produce inventory '+fy+' EFY','adj','produce',null,[drcr('1250',pch),drcr('4950',-pch)]);
    add(fe,'Manual depreciation adjustment '+fy+' EFY','adj','dep',null,[drcr('6100',num(adj.depreciation)),drcr('1510',-num(adj.depreciation))]);
    add(fe,'Manual withholding tax adjustment '+fy+' EFY','adj','adjwht','op',[drcr('1150',num(adj.wht)),drcr('1000',-num(adj.wht))]);
    add(fe,'Income tax for '+fy+' EFY','tax','tax',null,[drcr('8000',rep.taxDue),drcr('2300',-rep.taxDue)]);
    const wr = whtRecognised(fy);
    add(fe,'Withholding tax credit applied '+fy+' EFY','tax','taxcredit',null,[drcr('2300',wr),drcr('1150',-wr)]);
    add(fe,'Advance tax payments '+fy+' EFY','tax','advtax','op',[drcr('2300',num(adj.advance)),drcr('1000',-num(adj.advance))]);
  }
  return J.sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
}

/* balance of accounts up to and including a date (debit positive) */
function bal(J, accts, cut, party){
  let s = 0;
  J.forEach(e=>{ if(e.date>cut) return; e.lines.forEach(l=>{ if(accts.indexOf(l[0])>=0 && (party===undefined || l[3]===party)) s += (l[1]||0)-(l[2]||0); }); });
  return s;
}
function receivablesSplit(cut){
  const b = {};
  state.income.forEach(r=>{ if(!validDate(r.date)||r.date>cut) return; const k=r.customerId||'_anon'; b[k]=(b[k]||0)+incomeBalance(r); });
  state.payments.forEach(p=>{ if(!validDate(p.date)||p.date>cut) return; const k=p.customerId||'_anon'; b[k]=(b[k]||0)-num(p.amount); });
  let ar=0, adv=0; Object.keys(b).forEach(k=>{ if(b[k]>=0) ar+=b[k]; else adv+=-b[k]; });
  return {ar, adv};
}

function balanceSheet(sel){
  const J = buildJournal(sel), cc = fyRange(sel)[1], B = a=>bal(J,[a],cc), o = {};
  o.rawCash = B('1000'); o.cash = Math.max(o.rawCash,0); o.overdraft = Math.max(-o.rawCash,0);
  const sp = receivablesSplit(cc); o.ar = sp.ar; o.adv = sp.adv;
  o.wht = B('1150'); o.inv = B('1200'); o.produce = B('1250');
  const taxNet = -B('2300'); o.taxPay = Math.max(taxNet,0); o.taxRefund = Math.max(-taxNet,0);
  const vatNet = -B('2210'); o.vatPay = Math.max(vatNet,0); o.vatRecv = Math.max(-vatNet,0);
  o.fixedCost = B('1500'); o.accDep = -B('1510'); o.fixedNet = o.fixedCost - o.accDep;
  o.ap = -B('2000'); o.apA = -B('2050'); o.loanS = -B('2100'); o.loanL = -B('2150');
  o.bioImm = B('1600'); o.bioMatCost = B('1610'); o.bioAccAmort = -B('1620'); o.bioMatNet = o.bioMatCost - o.bioAccAmort; o.bioNet = o.bioImm + o.bioMatNet;
  o.ca = o.cash + o.ar + o.wht + o.taxRefund + o.inv + o.produce + o.vatRecv;
  o.livCost = B('1650'); o.livAcc = -B('1660'); o.livNet = o.livCost - o.livAcc;
  o.ta = o.ca + o.fixedNet + o.bioNet + o.livNet;
  o.cl = o.overdraft + o.ap + o.apA + o.adv + o.taxPay + o.vatPay + o.loanS; o.tl = o.cl + o.loanL;
  o.capital = -B('3000'); o.profitCum = -bal(J,PL_ACCTS,cc); o.drawCum = B('3100');
  o.retained = o.profitCum - o.drawCum; o.te = o.capital + o.retained;
  o.loans = o.loanS + o.loanL; o.check = o.ta - o.tl - o.te; o.J = J;
  return o;
}

function cashFlowData(sel){
  const J = buildJournal(sel), oc = fyRange(sel-1)[1], cc = fyRange(sel)[1];
  const mv = ac => bal(J,ac,cc) - bal(J,ac,oc), o = {};
  o.pbt = -mv(PL_PRETAX); o.dep = mv(['6100']); o.amort = mv(['6110','6120']); o.wo = mv(['6400','6410','6420','6430']); o.loss = mv(['6900']);
  o.capUnpaid = 0; o.capFeed = 0;
  J.forEach(e=>{ if(e.date>oc && e.date<=cc && e.kind==='bioCapStock') e.lines.forEach(l=>{ if(l[0]==='1600') o.capFeed += (l[1]-l[2]); }); });
  J.forEach(e=>{ if(e.date>oc && e.date<=cc && e.kind==='bioCapCredit') e.lines.forEach(l=>{ if(l[0]==='2000') o.capUnpaid += (l[2]-l[1]); }); });
  o.ownerPaid = 0;
  J.forEach(e=>{ if(e.date>oc && e.date<=cc && e.kind==='ownerPaidExp') e.lines.forEach(l=>{ if(l[0]==='3000') o.ownerPaid += (l[2]-l[1]); }); });
  o.dAR = -mv(['1100']); o.dWHT = -mv(['1150']); o.dInv = -mv(['1200']); o.dAP = -mv(['2000']);
  o.generated = o.pbt + o.dep + o.amort + o.wo + o.loss + o.ownerPaid + o.dAR + o.dWHT + o.dInv + o.dAP - o.capUnpaid - o.capFeed;
  o.taxPaid = -(mv(['8000']) + mv(['2300']));
  o.operating = o.generated + o.taxPaid;
  const byKind = {}, byCf = {op:0, inv:0, fin:0};
  o.nonCashAssets = 0;
  J.forEach(e=>{
    if(!(e.date>oc && e.date<=cc)) return;
    e.lines.forEach(l=>{ if(l[0]==='1000'){ const v = l[1]-l[2]; byKind[e.kind]=(byKind[e.kind]||0)+v; if(e.cf && byCf[e.cf]!==undefined) byCf[e.cf]+=v; } });
    if(e.kind==='assetCredit' || e.kind==='assetInKind'){ const l1 = e.lines.find(l=>l[0]==='1500'); if(l1) o.nonCashAssets += (l1[1]-l1[2]); }
    if(e.kind==='bioCredit' || e.kind==='bioInKind' || e.kind==='bioCapOwner' || e.kind==='bioCapCredit'){ e.lines.forEach(l=>{ if(l[0]==='1600' || l[0]==='1610' || l[0]==='1650') o.nonCashAssets += (l[1]-l[2]); }); }
  });
  o.k = byKind;
  o.investing = byCf.inv; o.financing = byCf.fin; o.directOperating = byCf.op;
  o.openCash = bal(J,['1000'],oc); o.closeCash = bal(J,['1000'],cc);
  o.net = o.operating + o.investing + o.financing;
  o.check = (o.openCash + o.net) - o.closeCash;
  o.opCheck = o.operating - o.directOperating;
  o.plCheck = o.pbt - fyReport(sel).netBefore;
  return o;
}

function latestOwnershipPct(p, cc){
  let best = null;
  state.acct.forEach(x=>{
    if(num(x.ownershipPct)>0 && validDate(x.date) && x.date<=cc && partyName(x.party).toLowerCase()===String(p).toLowerCase()){
      if(!best || x.date>=best.date) best = x;
    }
  });
  return best ? num(best.ownershipPct) : null;
}
function equityData(sel){
  const J = buildJournal(sel), oc = fyRange(sel-1)[1], cc = fyRange(sel)[1], o = {};
  o.capOpen = -bal(J,['3000'],oc); o.capClose = -bal(J,['3000'],cc);
  o.reOpen = -bal(J,PL_ACCTS,oc) - bal(J,['3100'],oc);
  o.profit = -(bal(J,PL_ACCTS,cc) - bal(J,PL_ACCTS,oc));
  o.draw = bal(J,['3100'],cc) - bal(J,['3100'],oc);
  o.reClose = o.reOpen + o.profit - o.draw;
  const cap = {}; const partyFlow = {};
  J.forEach(e=>{
    if(!(e.date>oc && e.date<=cc)) return;
    e.lines.forEach(l=>{
      if(l[0]==='3000'){
        cap[e.kind] = (cap[e.kind]||0) + (l[2]-l[1]);
        const pf = partyFlow[l[3]] || (partyFlow[l[3]] = {contrib:0, transfer:0});
        if(e.kind==='xfer') pf.transfer += (l[2]-l[1]); else pf.contrib += (l[2]-l[1]);
      }
    });
  });
  o.cap = cap;
  o.contribCash = cap.inv||0; o.saleOwn = cap.saleown||0; o.inKind = (cap.assetInKind||0) + (cap.ownerPaidExp||0) + (cap.bioInKind||0) + (cap.bioCapOwner||0);
  o.capCheck = o.capOpen + o.contribCash + o.saleOwn + o.inKind - o.capClose;
  const parties = new Set();
  J.forEach(e=>{ if(e.date<=cc) e.lines.forEach(l=>{ if((l[0]==='3000'||l[0]==='3100') && l[3]) parties.add(l[3]); }); });
  o.owners = Array.from(parties).map(p=>{
    const pf = partyFlow[p] || {contrib:0, transfer:0};
    return {name:p, open:-bal(J,['3000'],oc,p), contrib:pf.contrib, transfer:pf.transfer, close:-bal(J,['3000'],cc,p),
            draw:bal(J,['3100'],cc,p)-bal(J,['3100'],oc,p), pct:latestOwnershipPct(p,cc)};
  }).filter(r=>Math.abs(r.open)+Math.abs(r.contrib)+Math.abs(r.transfer)+Math.abs(r.close)+Math.abs(r.draw)>0.005);
  o.J = J;
  return o;
}

function loanRegister(cc){
  const m = {};
  const get = x => { const k = lenderName(x).toLowerCase(); return m[k] || (m[k] = {name:lenderName(x), term:null, borrowed:0, repaid:0, interest:0, rate:null, due:''}); };
  state.acct.forEach(x=>{
    const open = isOpeningType(x.type);
    if(!open && !(validDate(x.date) && x.date<=cc)) return;
    if(x.type===AT.LOAN || x.type===AT.OPLOAN){ const g = get(x); g.borrowed += num(x.amount); g.term = loanTermFor(x); if(num(x.interestRate)>0) g.rate = num(x.interestRate); if(x.dueDate) g.due = x.dueDate; }
    else if(x.type===AT.REPAY){ get(x).repaid += num(x.amount); }
    else if(x.type===AT.INT && String(x.party||'').trim()){ get(x).interest += num(x.amount); }
  });
  return Object.keys(m).map(k=>{ const g = m[k]; if(!g.term) g.term = TERM_LONG; return g; });
}

function acctValidate(r){
  const ty = r.type, open = isOpeningType(ty);
  if(!ty) return 'Choose a transaction type.';
  if(!(num(r.amount)>0)) return 'Amount must be greater than zero.';
  if(!open && !validDate(r.date)) return 'Date is required.';
  if([AT.SALE,AT.XFER,AT.LOAN,AT.REPAY,AT.OPLOAN].includes(ty) && !String(r.party||'').trim()) return 'Please enter the name (partner / investor / lender).';
  if(ty===AT.XFER){
    if(!String(r.fromParty||'').trim()) return 'Enter who the share is transferred from.';
    if(String(r.fromParty).trim().toLowerCase()===String(r.party).trim().toLowerCase()) return 'The two owners must be different people.';
  }
  if(ty!==AT.XFER) r.fromParty = '';
  if(![AT.INV,AT.SALE,AT.XFER].includes(ty)) r.ownershipPct = 0;
  if(![AT.LOAN,AT.REPAY,AT.OPLOAN].includes(ty)) r.loanTerm = '';
  if(![AT.LOAN,AT.OPLOAN].includes(ty)){ r.interestRate = 0; r.dueDate = ''; }
  if(open) r.date = r.date || '';
  return '';
}

function simpleTable(headers, bodyRows){
  return `<div class="panel"><div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th${h.num?' class="num"':''}>${h.label}</th>`).join('')}</tr></thead><tbody>${bodyRows}</tbody></table></div></div>`;
}
function acctDetails(x){
  const bits = [];
  if(x.type===AT.LOAN || x.type===AT.OPLOAN || x.type===AT.REPAY){ bits.push(String(loanTermFor(x)).indexOf('Short')===0 ? 'Short-term' : 'Long-term'); }
  if(num(x.interestRate)>0) bits.push(num(x.interestRate)+'% interest');
  if(x.dueDate) bits.push('due '+x.dueDate);
  if(x.type===AT.XFER && x.fromParty) bits.push('from '+x.fromParty);
  if(num(x.ownershipPct)>0) bits.push(num(x.ownershipPct)+'% ownership');
  return bits.join(' · ');
}

function repLine2(label, a, b, cls){ return `<tr><td class="${cls||'ind'}">${escHtml(t(label))}</td><td class="num mono ${cls==='tot'?'tot':''}">${fmtAcc(a)}</td><td class="num mono ${cls==='tot'?'tot':''}">${fmtAcc(b)}</td></tr>`; }
function repSec(label, cols){ return `<tr><td class="sec" colspan="${cols||2}">${escHtml(t(label))}</td></tr>`; }
function repHeader(title, efy, asAt){
  const tx = taxProfile(), rng = fyRange(efy), em = (lang==='am') ? EC_MONTHS_AM : EC_MONTHS_EN;

function repFooter(){ return `<div style="display:flex;justify-content:space-between;margin-top:34px;font-size:12.5px;"><div>${t('Prepared by')}: ____________________</div><div>${t('Signature / stamp')}: ____________________</div></div>`; }
function repWarn(msg){ return `<div class="no-print" style="background:var(--clay-soft);color:var(--clay);border-radius:8px;padding:9px 12px;margin:0 0 12px;font-size:12.5px;font-weight:600;">⚠ ${msg}</div>`; }
function repOk(msg){ return `<div class="no-print" style="background:#DCEBDD;color:var(--green-dark);border-radius:8px;padding:9px 12px;margin:0 0 12px;font-size:12.5px;font-weight:600;">✓ ${msg}</div>`; }

function renderBalanceSheet(efy){
  const c = balanceSheet(efy), p = balanceSheet(efy-1);
  const rows = [];
  const R = (label,key,cls)=>{ rows.push(repLine2(label, c[key], p[key], cls)); };
  const Rif = (label,key)=>{ if(Math.abs(c[key])>0.005 || Math.abs(p[key])>0.005) R(label,key); };
  rows.push(repSec('ASSETS',3));
  rows.push(repSec('Current assets',3));
  R('Cash and bank','cash'); R('Accounts receivable (customers)','ar'); Rif('Withholding tax receivable','wht'); Rif('Income tax refundable','taxRefund'); Rif('VAT receivable','vatRecv'); Rif('Feed inventory','inv'); Rif('Agricultural produce inventory (eggs, honey, etc.)','produce');
  R('Total current assets','ca','tot');
  rows.push(repSec('Non-current assets',3));
  R('Fixed assets at cost','fixedCost'); rows.push(repLine2('Less: accumulated depreciation', -c.accDep, -p.accDep));
  R('Net book value of fixed assets','fixedNet','tot');
  if(Math.abs(c.bioNet)>0.005 || Math.abs(p.bioNet)>0.005 || Math.abs(c.bioMatCost)>0.005 || Math.abs(p.bioMatCost)>0.005){
    Rif('Biological assets — immature layers (at cost)','bioImm'); Rif('Biological assets — mature layers (cost)','bioMatCost');
    if(Math.abs(c.bioAccAmort)>0.005 || Math.abs(p.bioAccAmort)>0.005) rows.push(repLine2('Less: accumulated amortisation — mature layers', -c.bioAccAmort, -p.bioAccAmort));
    R('Total biological assets','bioNet','tot');
  }
  if(Math.abs(c.livNet)>0.005 || Math.abs(p.livNet)>0.005 || Math.abs(c.livCost)>0.005 || Math.abs(p.livCost)>0.005){
    Rif('Other livestock — goats, sheep, oxen (cost)','livCost');
    if(Math.abs(c.livAcc)>0.005 || Math.abs(p.livAcc)>0.005) rows.push(repLine2('Less: accumulated amortisation — other livestock', -c.livAcc, -p.livAcc));
    R('Total other livestock','livNet','tot');
  }
  R('TOTAL ASSETS','ta','tot');
  rows.push(repSec('LIABILITIES',3));
  rows.push(repSec('Current liabilities',3));
  Rif('Bank overdraft (negative cash)','overdraft'); R('Accounts payable (suppliers)','ap'); Rif('Payable to asset suppliers','apA'); Rif('Customer advances / deposits','adv'); Rif('VAT payable','vatPay'); Rif('Income tax payable','taxPay'); R('Loans payable — short-term','loanS');
  R('Total current liabilities','cl','tot');
  rows.push(repSec('Non-current liabilities',3));
  R('Loans payable — long-term','loanL');
  R('TOTAL LIABILITIES','tl','tot');
  rows.push(repSec("OWNER'S EQUITY",3));
  R("Owner's capital (contributed)",'capital'); R('Retained earnings (profit after tax, less drawings)','retained');
  R("TOTAL OWNER'S EQUITY",'te','tot');
  rows.push(repLine2('TOTAL LIABILITIES + EQUITY', c.tl+c.te, p.tl+p.te, 'tot'));
  const warns = [];
  if(Math.abs(c.check)>0.01) warns.push(`The balance sheet is out of balance by ${fmtMoney(c.check)}. Please report this.`);
  if(c.rawCash<0) warns.push('Cash is negative, which cannot really happen. Record your opening cash balance, owner investment or loans in the Accounting tab, and mark assets you already owned as "Owned before using this app".');
  const ok = Math.abs(c.check)<=0.01 ? repOk('Balanced: total assets = total liabilities + owner\'s equity') : '';
  return `
  ${warns.map(repWarn).join('')}${ok}
  <div class="rep-sheet">
    ${repHeader('Balance Sheet (Statement of Financial Position)', efy, true)}
    <div class="tablewrap"><table class="rep-table">
      <thead><tr><th>${t('Description')}</th><th class="num">${efy} EFY</th><th class="num">${efy-1} EFY</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>
    <p class="note">Fixed assets follow the Assets tab (no part-year depreciation). Customer balances are split into receivables and advances. Feed stock is an asset only if switched on in the Accounting tab.</p>
    ${repFooter()}
  </div>`;
}

function renderCashFlow(efy){
  const c = cashFlowData(efy), k = c.k;
  const kv = key => k[key]||0;
  const rows = [];
  rows.push(repSec('OPERATING ACTIVITIES'));
  rows.push(repLine('Net profit / (loss) before tax', c.pbt));
  rows.push(repLine('Add: depreciation', c.dep));

function renderTrialBalance(efy){
  const b = balanceSheet(efy), J = b.J, cc = fyRange(efy)[1], oc = fyRange(efy-1)[1], rep = fyReport(efy);
  let td = 0, tc = 0;
  const tbRows = Object.keys(ACCT_NAMES).map(a=>{
    const v = bal(J,[a],cc); if(Math.abs(v)<0.005) return '';
    if(v>0) td += v; else tc += -v;
    return `<tr><td class="mono">${a}</td><td class="ind" style="padding-left:10px;">${escHtml(t(ACCT_NAMES[a]))}</td><td class="num mono">${v>0?fmtMoney(v):''}</td><td class="num mono">${v<0?fmtMoney(-v):''}</td></tr>`;
  }).join('') || `<tr><td colspan="4" style="color:var(--ink-soft);font-style:italic;">${t('No entries')}</td></tr>`;
  const ledgerProfit = -(bal(J,PL_PRETAX,cc) - bal(J,PL_PRETAX,oc));
  const diffPL = ledgerProfit - rep.netBefore;
  const entries = J.filter(e=>e.date>oc && e.date<=cc);
  const jRows = entries.map(e=>e.lines.map((l,i)=>`<tr><td class="mono">${i===0?escHtml(e.date):''}</td><td>${i===0?escHtml(e.desc):''}</td><td>${l[0]} ${escHtml(t(ACCT_NAMES[l[0]]||''))}${l[3]?' ('+escHtml(l[3])+')':''}</td><td class="num mono">${l[1]?fmtMoney(l[1]):''}</td><td class="num mono">${l[2]?fmtMoney(l[2]):''}</td></tr>`).join('')).join('')
    || `<tr><td colspan="5" style="color:var(--ink-soft);font-style:italic;">${t('No entries')}</td></tr>`;
  const warns = [];
  if(Math.abs(td-tc)>0.01) warns.push('Trial balance does not balance (difference '+fmtMoney(td-tc)+'). Please report this.');

  const ok = warns.length===0 ? repOk('Trial balance balances and the ledger profit agrees with the Profit & Loss report') : '';

/* ================= BRANCH / BATCH PROFITABILITY ================= */
function incomeBranchId(r){
  return (r.stockBatchId && String(r.stockBatchId).trim()) || (r.batchId && String(r.batchId).trim()) || '';
}
/** Contribution-style P&L by branch/batch for one EFY. Costs and sales must be tagged with batchId. */
function branchProfitData(efy){
  const map = {};
  const ensure = (id, meta)=>{
    if(!map[id]) map[id] = {id, branch:'', rev:0, feed:0, health:0, opex:0, cop:0, bio:0, purchase:0, qty:0, animalType:'', breed:'', label:id};
    if(meta){
      if(meta.animalType) map[id].animalType = meta.animalType;
      if(meta.breed!==undefined) map[id].breed = meta.breed;
      if(meta.qty!==undefined) map[id].qty = meta.qty;
      if(meta.label) map[id].label = meta.label;
      if(meta.branch) map[id].branch = meta.branch;
    }
    return map[id];
  };
  state.livestock.forEach(b=>{
    ensure(b.batchId, {
      animalType:b.animalType, breed:b.breed||'', qty:batchCurrentQty(b.batchId),
      branch:b.branch||'', label:b.batchId+' — '+(b.breed||b.animalType),
    });
  });
  ensure('_unallocated', {animalType:'—', breed:'', qty:0, branch:'—', label:'(Not tagged to a batch)'});

  state.income.filter(r=>inFY(r.date, efy)).forEach(r=>{
    const id = incomeBranchId(r) || '_unallocated';
    const m = ensure(id);
    if(!m.branch && id!=='_unallocated') m.branch = branchOfBatch(id);
    m.rev += incomeNet(r);
  });
  costRows().filter(r=>inFY(r.date, efy) && !expCapBatch(r)).forEach(r=>{
    const id = r.batchId || '_unallocated';
    const m = ensure(id);
    if(!m.branch && id!=='_unallocated') m.branch = branchOfBatch(id);
    const a = num(r.amount);
    if(r.category==='Feed Used') m.feed += a;
    else if(r.category==='Vaccination' || r.category==='Medication') m.health += a;
    else if(COST_OF_PRODUCTION_CATS.includes(r.category)) m.cop += a;
    else m.opex += a;
  });
  bioCharges().filter(c=>inFY(c.date, efy)).forEach(c=>{
    const m = ensure(c.batchId || '_unallocated');
    if(!m.branch && c.batchId) m.branch = branchOfBatch(c.batchId);
    m.bio += c.amt;
  });
  state.livestock.filter(b=>!isBioBatch(b) && num(b.purchaseCost)>0 && inFY(b.dateAcquired, efy)).forEach(b=>{
    ensure(b.batchId).purchase += num(b.purchaseCost);
  });

  return Object.keys(map).map(id=>{
    const m = map[id];
    m.totalCost = money2(m.feed + m.health + m.opex + m.cop + m.bio + m.purchase);
    m.rev = money2(m.rev);
    m.profit = money2(m.rev - m.totalCost);
    m.margin = m.rev > 0.005 ? (m.profit / m.rev * 100) : null;
    return m;
  }).filter(m=> m.id!=='_unallocated' || Math.abs(m.rev)+Math.abs(m.totalCost)>0.005)
    .sort((a,b)=>{
      if(a.id==='_unallocated') return 1;
      if(b.id==='_unallocated') return -1;
      const br = String(a.branch).localeCompare(String(b.branch));
      if(br) return br;
      return b.profit - a.profit;
    });
}
function renderBranchProfit(efy){
  const rows = branchProfitData(efy);
  const tot = rows.reduce((s,r)=>({rev:s.rev+r.rev, cost:s.cost+r.totalCost, profit:s.profit+r.profit}), {rev:0,cost:0,profit:0});
  const body = rows.length ? rows.map(r=>`
    <tr>
      <td>${escHtml(r.branch||'—')}</td>
      <td class="mono">${escHtml(r.label)}</td>
      <td>${escHtml(r.animalType||'—')}</td>
      <td class="num mono">${r.id==='_unallocated'?'—':fmtNum(r.qty)}</td>
      <td class="num mono">${fmtMoney(r.rev)}</td>
      <td class="num mono">${fmtMoney(r.feed)}</td>
      <td class="num mono">${fmtMoney(r.health)}</td>
      <td class="num mono">${fmtMoney(r.opex + r.cop)}</td>
      <td class="num mono">${fmtMoney(r.bio + r.purchase)}</td>
      <td class="num mono">${fmtMoney(r.totalCost)}</td>
      <td class="num mono"><strong style="color:${r.profit>=0?'var(--green-dark)':'var(--clay)'}">${fmtMoney(r.profit)}</strong></td>
      <td class="num mono">${r.margin===null?'—':r.margin.toFixed(1)+'%'}</td>
    </tr>`).join('') : emptyRow(12,'No batch-tagged activity in this year. Tag sales and costs with a batch to see profitability.');
  const totRow = `<tr class="tot"><td colspan="4">Total</td>
    <td class="num mono tot">${fmtMoney(tot.rev)}</td><td colspan="4"></td>
    <td class="num mono tot">${fmtMoney(tot.cost)}</td>
    <td class="num mono tot">${fmtMoney(tot.profit)}</td>
    <td class="num mono tot">${tot.rev>0.005?(tot.profit/tot.rev*100).toFixed(1)+'%':'—'}</td></tr>`;
  return `
  ${repOk('Contribution by branch / batch for '+efy+' EFY (Hamle 1 – Sene 30)')}
  <div class="rep-sheet">
    ${repHeader('Branch / batch profitability', efy, true)}
    <div class="tablewrap"><table class="rep-table">
      <thead><tr>
        <th>Branch</th><th>Batch</th><th>Type</th><th class="num">Stock now</th>
        <th class="num">Revenue</th><th class="num">Feed</th><th class="num">Health</th>
        <th class="num">Other costs</th><th class="num">Bio / purchase</th>
        <th class="num">Total cost</th><th class="num">Profit / (loss)</th><th class="num">Margin</th>
      </tr></thead>
      <tbody>${body}${rows.length?totRow:''}</tbody>
    </table></div>
    <p class="note"><strong>How this works:</strong> Each branch has its own batch numbers (ADD-POU-001, BIS-POU-001…). Tag income and costs to a batch; the branch comes from that batch.
    Shared costs with no batch appear under “(Not tagged to a batch)”.</p>
    ${repFooter()}
  </div>`;
}

function batchReferenced(batchId){
  return allReductions().some(r=>r.batchId===batchId) || state.feeding.some(r=>r.batchId===batchId) || state.production.some(r=>r.batchId===batchId)
      || state.vaccinations.some(r=>r.batchId===batchId) || state.medications.some(r=>r.batchId===batchId) || state.expenses.some(r=>r.batchId===batchId)
      || state.income.some(r=>r.stockBatchId===batchId);
}
function livestockValidate(r){
  if(!validDate(r.dateAcquired)) return 'Date acquired is required.';
  if(!(num(r.initialQty)>0)) return 'Initial quantity must be greater than zero.';
  if(num(r.purchaseCost)<0) return 'Purchase cost cannot be negative.';
  if(state.livestock.some(b=>b.id!==r.id && b.batchId===r.batchId)) return 'Another batch already uses this ID.';
  const old = state.livestock.find(b=>b.id===r.id);
  if(old && old.batchId!==r.batchId && batchReferenced(old.batchId)) return 'This batch already has records (reductions, feeding, sales, health…). Its ID cannot be changed.';
  if(old && old.animalType!==r.animalType && batchReferenced(old.batchId)) return 'This batch already has records. Its animal type cannot be changed.';
  if(r.animalType!=='Poultry') r.bio = 'No';
  if(r.bio===BIO_YES){
    if(num(r.layingAgeWeeks)<=0 && num(r.layingAgeMonths)<=0) r.layingAgeWeeks = DEFAULT_LAYING_AGE_WEEKS;
    if(num(r.amortMonths)<=0) r.amortMonths = DEFAULT_AMORT_MONTHS;
  }
  if(!ASSET_ANIMALS.includes(r.animalType)) r.amortMonthsOther = 0;
  const used = allReductions().filter(x=>x.batchId===(old?old.batchId:r.batchId)).reduce((t,x)=>t+num(x.qty),0);
  if(num(r.initialQty) < used) return 'Initial quantity ('+fmtNum(r.initialQty)+') is lower than the '+fmtNum(used)+' animals already removed from this batch.';
  return '';
}
function reductionValidate(r){
  const b = state.livestock.find(x=>x.batchId===r.batchId);
  if(!b) return 'Choose an existing batch.';
  if(!(num(r.qty)>0)) return 'Quantity must be greater than zero.';
  if(r.reason==='Sale') return 'Sales are entered in Income, not here.';
  if(validDate(b.dateAcquired) && validDate(r.date) && r.date<b.dateAcquired) return 'The date is before this batch was acquired ('+b.dateAcquired+').';
  const left = batchCurrentQty(r.batchId, r.id);
  if(num(r.qty) > left + 1e-9) return 'Only '+fmtNum(left)+' animals are left in batch '+r.batchId+'.';
  r.animalType = b.animalType;
  return '';
}
function prodReductionValidate(r){
  if(!(num(r.qty)>0)) return 'Quantity must be greater than zero.';
  if(r.reason==='Sale') return 'Sales are entered in Income, not here.';
  const others = allProdReductions().filter(x=>x.product===r.product && x.id!==r.id).reduce((t,x)=>t+num(x.qty),0);
  const left = productGoodOutput(r.product) - others;
  if(num(r.qty) > left + 1e-9) return 'Only '+fmtNum(left)+' '+r.product+' in stock.';
  return '';
}
function feedPurchaseValidate(r){
  if(!(num(r.qty)>0)) return 'Quantity must be greater than zero.';
  if(!(num(r.unitCost)>0)) return 'Enter the unit cost — it is needed to value the feed stock.';
  return '';
}
function feedingValidate(r){
  if(!(num(r.qtyUsed)>0)) return 'Quantity used must be greater than zero.';
  if(!r.period || !FEED_PERIODS.some(p=>p.value===r.period)) r.period = 'Day';
  const b = state.livestock.find(x=>x.batchId===r.batchId);
  if(!b) return 'Choose an existing batch.';
  if(validDate(b.dateAcquired) && validDate(r.date) && r.date<b.dateAcquired) return 'The date is before this batch was acquired ('+b.dateAcquired+').';
  r.animalType = b.animalType;
  const avail = feedStockAsOf(r.feedType, r.date, r.id);
  if(num(r.qtyUsed) > avail + 1e-9) return 'Only '+fmtNum(Math.max(0,avail))+' kg of '+r.feedType+' in stock on '+r.date+'. Record the feed purchase first.';
  return '';
}
function incomeValidate(r){
  if(!(num(r.qty)>0)) return 'Quantity must be greater than zero.';
  const old = state.income.find(x=>x.id===r.id);
  const prod = incomeProduct(r);
  if(prod){
    const oldQty = (old && incomeProduct(old)===prod) ? num(old.qty) : 0;
    const left = productStock(prod) + oldQty;
    if(num(r.qty) > left + 1e-9) return 'Only '+fmtNum(left)+' '+prod+' in stock. Record the production first (Production tab).';
  }
  if(incomeIsLivestockSale(r)){
    if(!r.stockBatchId) return 'Choose the batch / herd the animals are sold from.';
    const b = state.livestock.find(x=>x.batchId===r.stockBatchId);
    if(!b) return 'Choose an existing batch.';
    const left = batchCurrentQty(r.stockBatchId, old ? 'inc:'+old.id : undefined);
    if(num(r.qty) > left + 1e-9) return 'Only '+fmtNum(left)+' animals are left in batch '+r.stockBatchId+'.';
  }else r.stockBatchId = '';
  return '';
}
function expenseValidate(r){
  if(AUTO_COST_CATS.includes(r.category)) return 'This cost is created automatically: feed from the Feed tab, vaccines and medication from the Health tab, animals from the Livestock tab.';
  if(!(num(r.amount)>0)) return 'Amount must be greater than zero.';
  if(!r.category) return 'Choose an expense category.';
  // batchId = which branch/flock (tracking). Capitalise only if rearing category + Auto.
  if(r.batchId && !state.livestock.some(b=>b.batchId===r.batchId)) r.batchId = '';
  if(ALWAYS_OPEX_CATS.includes(r.category)){ r.capMode = 'No'; r.isCapitalized = false; }
  else if(r.capMode!=='Auto' || !REARING_CATS.includes(r.category) || !r.batchId){ r.capMode = 'No'; }
  return '';
}
/* ================= SMART FORMS: the fields follow what is being sold or bought ================= */
const PURCHASE_KINDS = [
  {value:'Feed', label:'Feed (adds to feed stock)'},
  {value:'Livestock', label:'Animals (new batch / herd)'},
  {value:'Vaccine', label:'Vaccine (health log)'},
  {value:'Medication', label:'Medication (health log)'},
  {value:'Other', label:'Other cost (labor, rent, transport…)'}
];
function fundFromPay(ps){ ps = ps||''; if(ps.indexOf('Unpaid')===0) return FUND_CREDIT; if(ps.indexOf('Paid personally')===0) return FUND_OWNER; return FUND_PAID; }
async function submitPurchase(rec){
  const k = rec.kind;
  if(!k) return 'Choose what you are buying.';
  if(!validDate(rec.date)) return 'Date is required.';
  let msg = '';
  if(k==='Feed'){
    const r = {id:uid(), date:rec.date, feedType:rec.f_type, qty:num(rec.f_qty), unitCost:num(rec.f_unit), payStatus:rec.f_pay||PAY_PAID, supplier:rec.f_supplier||'', notes:rec.f_notes||''};
    if(!r.feedType) return 'Choose the feed type.';
    msg = feedPurchaseValidate(r); if(msg) return msg;
    state.feedPurchases.push(r); await saveEntity('feedPurchases');
  }
  else if(k==='Livestock'){
    if(!rec.l_type) return 'Choose the animal type.';
    const branch = String(rec.l_branch||'').trim() || (ensureBranches()[0]||'Main');
    if(!ensureBranches().includes(branch) && branch) ensureBranches().push(branch);
    let batchCode = String(rec.l_batch||'').trim();
    if(!batchCode) batchCode = nextBatchId(rec.l_type, branch);
    if(state.livestock.some(b=>b.batchId===batchCode)) batchCode = nextBatchId(rec.l_type, branch);
    const qty = num(rec.l_qty), unit = num(rec.l_unit);
    if(!(qty>0)) return 'Enter how many animals were bought.';
    const r = {id:uid(), animalType:rec.l_type, branch:branch, batchId:batchCode, breed:rec.l_breed||'', dateAcquired:rec.date, source:rec.l_source||'', initialQty:qty,
      purchaseCost:money2(qty*unit), fundedBy:fundFromPay(rec.l_pay), bio:rec.l_type==='Poultry' ? (rec.l_bio||'No') : 'No',
      ageWeeksAtPurchase:num(rec.l_age), layingAgeWeeks:num(rec.l_lay)||DEFAULT_LAYING_AGE_WEEKS, amortMonths:num(rec.l_amort), amortMonthsOther:num(rec.l_amortO), notes:rec.l_notes||''};
    msg = livestockValidate(r); if(msg) return msg;
    state.livestock.push(r); await refreshCapFlags(); await saveEntity('livestock');
  }
  else if(k==='Vaccine'){
    const b = state.livestock.find(x=>x.batchId===rec.v_batch);
    if(!b) return 'Choose the batch that was vaccinated.';
    if(!String(rec.v_name||'').trim()) return 'Enter the vaccine name.';
    state.vaccinations.push({id:uid(), date:rec.date, animalType:b.animalType, batchId:b.batchId, vaccine:rec.v_name, dose:rec.v_dose||'', cost:num(rec.v_cost), payStatus:rec.v_pay||PAY_PAID, administeredBy:rec.v_by||'', notes:rec.v_notes||''});
    await refreshCapFlags(); await saveEntity('vaccinations');
  }
  else if(k==='Medication'){
    const b = state.livestock.find(x=>x.batchId===rec.m_batch);
    if(!b) return 'Choose the batch that was treated.';
    if(!String(rec.m_name||'').trim()) return 'Enter the medication name.';
    state.medications.push({id:uid(), date:rec.date, animalType:b.animalType, batchId:b.batchId, disease:rec.m_disease||'', medication:rec.m_name, dosage:rec.m_dose||'', cost:num(rec.m_cost), payStatus:rec.m_pay||PAY_PAID, notes:rec.m_notes||''});
    await refreshCapFlags(); await saveEntity('medications');
  }
  else{
    const r = {id:uid(), date:rec.date, category:String(rec.o_cat||'').trim(), description:rec.o_desc||'', amount:num(rec.o_amount), payStatus:rec.o_pay||PAY_PAID, refNo:rec.o_ref||'', supplier:rec.o_supplier||'',
      nonDeductible:rec.o_nonded||'No', batchId:rec.o_batch||'', capMode:rec.o_cap||'No', notes:rec.o_notes||''};
    if(!r.category) return 'Choose the expense category (e.g. Labor, Utilities).';
    if(!(r.amount>0)) return 'Amount must be greater than zero.';
    // batchId kept for branch/flock tracking; capitalisation only for rearing costs when user picks Auto
    if(ALWAYS_OPEX_CATS.includes(r.category)) r.capMode = 'No';
    msg = expenseValidate(r); if(msg) return msg;
    r.isCapitalized = (r.capMode==='Auto' && !!expEligibleBatch(r));
    state.expenses.push(r); await refreshCapFlags(); await saveEntity('expenses');
  }
  return '';
}
function purchaseFormHook(root){
  const q = n=>root.querySelector('[name="'+n+'"]'), v = n=>{ const e = q(n); return e ? e.value : ''; };
  const hint = document.createElement('div'); hint.className = 'note'; hint.style.cssText = 'font-weight:600;margin:6px 0 10px;';
  const acts = root.querySelector('.modal-actions'); if(acts) acts.before(hint);
  const batchEl = q('l_batch');
  if(batchEl){ batchEl.readOnly = true; batchEl.style.background = 'var(--surface-alt)'; batchEl.placeholder = 'Auto from branch + animal type'; }
  const assignBatch = ()=>{
    if(!batchEl) return;
    const t = v('l_type'), br = v('l_branch');
    if(t && br) batchEl.value = nextBatchId(t, br);
    else if(t) batchEl.value = nextBatchId(t, ensureBranches()[0]||'Main');
    else batchEl.value = '';
  };
  const typeEl = q('l_type');
  if(typeEl) typeEl.addEventListener('change', assignBatch);
  const branchEl = q('l_branch');
  if(branchEl) branchEl.addEventListener('change', assignBatch);
  const kindEl = q('kind');
  if(kindEl) kindEl.addEventListener('change', ()=>{ if(v('kind')==='Livestock') assignBatch(); });
  const upd = ()=>{
    const k = v('kind'); let h = '';
    if(k==='Feed'){
      const tot = num(v('f_qty'))*num(v('f_unit')), ft = v('f_type');
      h = 'Total: '+fmtMoney(tot)+'.'+(ft ? ' Feed stock now '+fmtNum(feedStock(ft))+' kg → '+fmtNum(feedStock(ft)+num(v('f_qty')))+' kg.' : '')+' Booked as feed inventory (asset); it becomes a cost when fed out.';
    }else if(k==='Livestock'){
      assignBatch();
      const tot = num(v('l_qty'))*num(v('l_unit')), t = v('l_type'), br = v('l_branch')||'Main';
      const how = (t==='Poultry' && v('l_bio')==='Yes') ? 'an asset — layer flock (immature layers until laying age, then amortised)' : ASSET_ANIMALS.includes(t) ? 'an asset — livestock, kept at cost' : 'an expense (cost of production)';
      h = 'Branch: '+br+'. Batch code: '+(v('l_batch')||'—')+' (auto, this branch starts counting from 001). Total: '+fmtMoney(tot)+'. Booked as '+how+'.';
    }else if(k==='Vaccine' || k==='Medication'){
      h = 'Booked as an expense now — or capitalised into the flock’s asset if it is a layer flock still under laying age. Cost is logged in the Health tab.';
    }else if(k==='Other'){
      const cat = v('o_cat'), bat = v('o_batch');
      h = (cat||'This cost')+(bat?' for '+bat:'')+' is recorded as an expense on the P&L by default. Pick the batch (which includes its branch). Capitalise only if you explicitly choose Auto for a young layer rearing cost.';
    }
    hint.textContent = h;
  };
  root.querySelectorAll('input,select').forEach(e=>{ e.addEventListener('input', upd); e.addEventListener('change', upd); });
  upd();
}
function incomeFormHook(root, record){
  const q = n=>root.querySelector('[name="'+n+'"]');
  const cat = q('category'), qty = q('qty'), price = q('unitPrice'), batch = q('stockBatchId'), desc = q('description');
  if(!cat || !qty || !price || !batch) return;
  const setLabel = (el, txt)=>{ const l = el.closest('label'); if(l && l.childNodes[0]) l.childNodes[0].nodeValue = txt; };
  const hint = document.createElement('div'); hint.className = 'note'; hint.style.cssText = 'font-weight:600;margin:-2px 0 8px;';
  qty.closest('label').after(hint);
  const apply = ()=>{
    const c = cat.value, prod = PRODUCT_SALE_CATS[c], live = LIVESTOCK_SALE_CATS.includes(c);
    let ql = 'Quantity *', pl = 'Unit Price (ETB) *', h = '';
    qty.removeAttribute('max');
    if(prod){
      const u = productUnit(prod), own = (record && incomeProduct(record)===prod) ? num(record.qty) : 0, avail = productStock(prod) + own;
      const one = u==='eggs' ? 'egg' : u==='liters' ? 'liter' : u;
      ql = 'Quantity sold ('+u+') *'; pl = 'Price per '+one+' (ETB) *';
      h = 'In stock: '+fmtNum(avail)+' '+u+(u.toLowerCase()===prod.toLowerCase() ? '' : ' of '+prod.toLowerCase())+'. This sale reduces the stock automatically.';
      qty.max = avail;
      desc.placeholder = 'e.g. '+prod+' sold to …';
    }else if(live){
      const poultry = c==='Live Bird Sales', cur = batch.value;
      const exclude = record ? 'inc:'+record.id : undefined;
      const opts = state.livestock.filter(b=> poultry ? b.animalType==='Poultry' : b.animalType!=='Poultry');
      batch.innerHTML = '<option value="">-- select --</option>' + opts.map(b=>`<option value="${escHtml(b.batchId)}">${escHtml(b.batchId+' — '+(b.breed||b.animalType)+' ('+fmtNum(batchCurrentQty(b.batchId, exclude))+' left)')}</option>`).join('');
      batch.value = cur;
      ql = (poultry ? 'Number of birds sold' : 'Number of animals sold')+' *'; pl = 'Price per '+(poultry?'bird':'animal')+' (ETB) *';
      if(batch.value){ const left = batchCurrentQty(batch.value, exclude); qty.max = left; h = 'Left in '+batch.value+': '+fmtNum(left)+'. This sale removes them from the herd and writes off their book value automatically.'; }
      else h = 'Choose the batch the animals are sold from.';
    }
    setLabel(qty, ql); setLabel(price, pl); hint.textContent = h;
  };
  cat.addEventListener('change', apply); batch.addEventListener('change', apply); apply();
}

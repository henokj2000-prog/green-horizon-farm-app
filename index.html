function fieldHTML(f, value){
  const val = (value!==undefined && value!==null) ? value : (f.default!==undefined ? f.default : '');
  const req = f.required ? ' required' : '';
  let dfor = f.showFor ? ` data-for="${escHtml(f.showFor.join('|'))}"` : '';
  if(f.showWhen) dfor += ` data-sw="${escHtml(JSON.stringify([].concat(f.showWhen)))}"`;
  if(f.type==='select'){
    const opts = f.options||[];
    const optHtml = opts.map(o=>{
      const ov = (typeof o==='object') ? o.value : o;
      const ol = (typeof o==='object') ? o.label : o;
      return `<option value="${escHtml(ov)}" ${String(val)===String(ov)?'selected':''}>${escHtml(ol)}</option>`;
    }).join('');
    return `<label${dfor}>${escHtml(f.label)}${f.required?' *':''}<select name="${f.name}"${req}><option value="">-- select --</option>${optHtml}</select></label>`;
  }
  if(f.type==='textarea'){
    return `<label${dfor}>${escHtml(f.label)}<textarea name="${f.name}">${escHtml(val)}</textarea></label>`;
  }
  const stepAttr = f.type==='number' ? ' step="any"' : '';
  const placeholder = f.placeholder ? ` placeholder="${escHtml(f.placeholder)}"` : '';
  return `<label${dfor}>${escHtml(f.label)}${f.required?' *':''}<input type="${f.type}" name="${f.name}" value="${escHtml(val)}"${stepAttr}${placeholder}${req}></label>`;
}

function openForm(formKey, existingId){
  const cfg = FORM_CONFIGS()[formKey];
  const record = existingId ? state[cfg.entity].find(r=>r.id===existingId) : null;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h2>${record?'Edit ':'Add '}${cfg.title}</h2>
        <form id="entityForm">
          ${cfg.fields.map(f=>fieldHTML(f, record ? record[f.name] : undefined)).join('')}
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancelForm">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>`;
  translateDom(root);
  setupConditionalFields(root);
  if(cfg.onOpen) cfg.onOpen(root, record);
  document.getElementById('cancelForm').addEventListener('click', closeForm);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeForm(); });
  document.getElementById('entityForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    submitForm(formKey, existingId, cfg, e.target);
  });
}
function closeForm(){ document.getElementById('modalRoot').innerHTML=''; }
/* show/hide form fields that only apply to some transaction types */
function setupConditionalFields(root){
  const sel = root.querySelector('select[name="type"]');
  if(sel && root.querySelector('label[data-for]')){
    const apply = ()=>{ root.querySelectorAll('label[data-for]').forEach(l=>{ const arr = l.getAttribute('data-for').split('|'); l.style.display = (sel.value && arr.indexOf(sel.value)<0) ? 'none' : ''; }); };
    sel.addEventListener('change', apply); apply();
  }
  root.querySelectorAll('label[data-sw]').forEach(l=>{
    let conds = []; try{ conds = JSON.parse(l.getAttribute('data-sw')); }catch(e){}
    const check = ()=> conds.every(c=>{ const ctl = root.querySelector('[name="'+c.name+'"]'); if(!ctl) return true; return c.nonEmpty ? !!ctl.value : (c.values||[]).indexOf(ctl.value)>=0; });
    const apply = ()=>{
      const on = check();
      l.style.display = on ? '' : 'none';
      // Disable hidden controls so they are not submitted and cannot block HTML5 validation
      l.querySelectorAll('input,select,textarea').forEach(el=>{ el.disabled = !on; });
    };
    conds.forEach(c=>{ const ctl = root.querySelector('[name="'+c.name+'"]'); if(ctl) ctl.addEventListener('change', apply); });
    apply();
  });
}

async function submitForm(formKey, existingId, cfg, formEl){
  const fd = new FormData(formEl);
  const record = existingId ? Object.assign({}, state[cfg.entity].find(r=>r.id===existingId)) : {id: uid()};
  cfg.fields.forEach(f=>{
    let v = fd.get(f.name);
    if(f.type==='number') v = v===''||v===null ? 0 : parseFloat(v);
    record[f.name] = v;
  });
  if(cfg.custom){ const msg = await cfg.custom(record); if(msg){ say(msg); return; } closeForm(); render(); showToast('Saved'); return; }
  if(cfg.validate){ const msg = cfg.validate(record); if(msg){ say(msg); return; } }
  const arr = state[cfg.entity];
  const idx = arr.findIndex(r=>r.id===record.id);
  if(idx>=0) arr[idx]=record; else arr.push(record);
  if(cfg.entity==='expenses' || cfg.entity==='livestock') await refreshCapFlags();
  await saveEntity(cfg.entity);
  closeForm();
  render();
  showToast('Saved');
}

function deleteGuard(entityKey, id){
  if(entityKey==='livestock'){
    const b = state.livestock.find(x=>x.id===id);
    if(b && batchReferenced(b.batchId)) return 'This batch already has records (reductions, feeding, sales, health, production…). Delete or move those first.';
  }
  if(entityKey==='feedPurchases'){
    const keep = state.feedPurchases.filter(x=>x.id!==id), f = state.feedPurchases.find(x=>x.id===id);
    if(f){
      let q = 0; keep.forEach(x=>{ if(x.feedType===f.feedType) q += num(x.qty); });
      state.feeding.forEach(x=>{ if(x.feedType===f.feedType) q -= num(x.qtyUsed); });
      if(q < -1e-9) return 'Deleting this purchase would leave '+f.feedType+' with negative stock because the feed was already used.';
    }
  }
  if(entityKey==='production'){
    const pr = state.production.find(x=>x.id===id);
    if(pr){
      const others = state.production.filter(x=>x.id!==id && x.product===pr.product).reduce((t,x)=>t+(num(x.qtyProduced)-num(x.waste)),0);
      if(others - productReducedQty(pr.product) < -1e-9) return 'Deleting this would leave '+pr.product+' with negative stock because some was already sold or used.';
    }
  }
  return '';
}
async function deleteRecord(entityKey, id){
  const blocked = deleteGuard(entityKey, id);
  if(blocked){ say(blocked); return; }
  if(!ask('Delete this entry? This cannot be undone.')) return;
  state[entityKey] = state[entityKey].filter(r=>r.id!==id);
  if(entityKey==='livestock') await refreshCapFlags();
  await saveEntity(entityKey);
  render();
  showToast('Deleted');
}

/* ---------------- Google Drive sync (optional, client-side OAuth) ---------------- */
function ensureGoogleLoaded(){
  return typeof window.google !== 'undefined' && window.google.accounts && window.google.accounts.oauth2;
}

function initTokenClientIfNeeded(){
  if(driveRuntime.tokenClient) return true;
  if(!ensureGoogleLoaded()) return false;
  if(!driveConfig.clientId) return false;
  driveRuntime.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: driveConfig.clientId,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: onDriveTokenResponse
  });
  return true;
}

async function onDriveTokenResponse(resp){
  driveRuntime.connecting = false;
  if(!resp || resp.error){
    showToast('Google sign-in was cancelled or failed');
    render();
    return;
  }
  driveRuntime.accessToken = resp.access_token;
  driveRuntime.connected = true;
  try{
    await afterDriveConnected();
  }catch(e){
    console.error(e);
    showToast('Connected, but the first sync failed — try "Sync now"');
  }
  render();
}

function connectDrive(){
  const input = document.getElementById('driveClientIdInput');
  if(input){
    const val = (input.value||'').trim();
    if(val){ driveConfig.clientId = val; saveDriveConfigLocal(); }
  }
  if(!driveConfig.clientId){ say('Paste your Google Client ID first.'); return; }
  if(!ensureGoogleLoaded()){
    showToast('Still loading Google sign-in — try again in a moment');
    return;
  }
  if(!initTokenClientIfNeeded()){ showToast('Could not start Google sign-in'); return; }
  driveRuntime.connecting = true;
  render();
  driveRuntime.tokenClient.requestAccessToken({prompt:'consent'});
}

function disconnectDrive(){
  driveRuntime.connected = false;
  driveRuntime.accessToken = null;
  showToast('Disconnected — your data stays safely on this device');
  render();
}

async function driveApiFetch(url, options){
  const res = await fetch(url, Object.assign({}, options, {
    headers: Object.assign({}, (options && options.headers) || {}, { Authorization: 'Bearer ' + driveRuntime.accessToken })
  }));
  if(res.status === 401){
    driveRuntime.connected = false;
    showToast('Google Drive session expired — tap Connect to sign in again');
    render();
    throw new Error('Drive session expired (401)');
  }
  return res;
}

async function driveFindFile(){
  const q = encodeURIComponent("name='green-horizon-farm-data.json' and trashed=false");
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0] : null;
}

async function driveCreateFile(){
  const res = await driveApiFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name:'green-horizon-farm-data.json', mimeType:'application/json' })
  });
  const data = await res.json();
  return data.id;
}

function buildBackupPayload(){
  const payload = { app:'Green Horizon Farm Manager', exportedAt: new Date().toISOString(), setup: state.setup, calc: state.calc };
  ENTITY_KEYS.forEach(k=>{ payload[k] = state[k]; });
  return payload;
}

async function driveUploadState(){
  if(!driveRuntime.connected || !driveConfig.fileId) return;
  await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveConfig.fileId}?uploadType=media`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(buildBackupPayload(), null, 2)
  });
  driveConfig.lastSync = new Date().toISOString();
  saveDriveConfigLocal();
}

async function driveDownloadIntoState(){
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${driveConfig.fileId}?alt=media`);
  const data = await res.json();
  state.setup = data.setup || state.setup;
  state.calc = data.calc || state.calc;
  ENTITY_KEYS.forEach(k=>{ state[k] = Array.isArray(data[k]) ? data[k] : []; });
  await refreshCapFlags();
  await Promise.all([saveKey(STORE_KEYS.setup, state.setup), saveKey(STORE_KEYS.calc, state.calc), ...ENTITY_KEYS.map(k=>saveKey(STORE_KEYS[k], state[k]))]);
  driveConfig.lastSync = new Date().toISOString();
  saveDriveConfigLocal();
}

async function afterDriveConnected(){
  const existing = await driveFindFile();
  if(existing){
    driveConfig.fileId = existing.id;
    saveDriveConfigLocal();
    const wantsDownload = ask("Found existing farm data on Google Drive. OK = load it (replaces data on this device) Cancel = keep this device's data and upload it to Drive instead");
    if(wantsDownload){
      await driveDownloadIntoState();
      showToast('Loaded data from Google Drive');
    }else{
      await driveUploadState();
      showToast("Uploaded this device's data to Google Drive");
    }
  }else{
    driveConfig.fileId = await driveCreateFile();
    saveDriveConfigLocal();
    await driveUploadState();
    showToast('Google Drive connected — backup created');
  }
}

async function syncNow(){
  if(!driveRuntime.connected){ showToast('Not connected'); return; }
  try{
    await driveUploadState();
    showToast('Synced to Google Drive');
    render();
  }catch(e){ console.error(e); }
}

/* ---------------- Backup / Restore ---------------- */
function exportBackup(){
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `green-horizon-farm-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('Backup downloaded');
}

const ENTITY_KEYS = ['livestock','reductions','production','prodReductions','feedPurchases','feeding','income','expenses','vaccinations','medications','assets','customers','payments','comments','inquiries','acct'];

/* Entities with a date field that can be archived by fiscal year */
const ARCHIVE_DATE_FIELDS = {
  reductions:'date', production:'date', prodReductions:'date',
  feedPurchases:'date', feeding:'date', income:'date', expenses:'date',
  vaccinations:'date', medications:'date', payments:'date', comments:'date',
  inquiries:'date', acct:'date'
};

function downloadJson(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function buildArchivePayload(efy){
  const cutoff = fyRange(efy)[1];
  const payload = {
    app:'Green Horizon Farm Manager',
    type:'year-archive',
    archivedThroughEFY: efy,
    cutoffDate: cutoff,
    exportedAt: new Date().toISOString(),
    setup: state.setup,
    calc: state.calc,
    livestock: state.livestock.slice(),
    customers: state.customers.slice(),
    assets: state.assets.slice()
  };
  Object.keys(ARCHIVE_DATE_FIELDS).forEach(k=>{
    const field = ARCHIVE_DATE_FIELDS[k];
    payload[k] = (state[k]||[]).filter(r=>r[field] && r[field]<=cutoff);
  });
  return payload;
}

function exportYearArchive(efy){
  const payload = buildArchivePayload(efy);
  downloadJson(payload, `green-horizon-archive-through-EFY${efy}-${todayISO()}.json`);
  showToast('Archive downloaded (through '+efy+' EFY)');
}

/** Remove archived transactions from live state; adjust livestock initialQty so current stock stays correct. */
async function purgeArchivedYear(efy){
  const cutoff = fyRange(efy)[1];
  // 1) Freeze livestock qty as of cutoff, then drop old reductions
  state.livestock.forEach(b=>{
    const qtyAtCutoff = num(b.initialQty) - allReductions().filter(r=>r.batchId===b.batchId && r.date && r.date<=cutoff).reduce((s,r)=>s+num(r.qty),0);
    b.initialQty = Math.max(0, qtyAtCutoff);
    // Optional note for audit trail
    if(!b.notes) b.notes = '';
    if(b.notes.indexOf('[Archived through')<0) b.notes = (b.notes?b.notes+' ':'')+'[Archived through EFY '+efy+'; opening qty reset to stock at '+cutoff+']';
  });
  // 2) Remove date-bound records on or before cutoff
  Object.keys(ARCHIVE_DATE_FIELDS).forEach(k=>{
    const field = ARCHIVE_DATE_FIELDS[k];
    state[k] = (state[k]||[]).filter(r=>!(r[field] && r[field]<=cutoff));
  });
  // 3) Persist
  await Promise.all([saveEntity('livestock'), ...Object.keys(ARCHIVE_DATE_FIELDS).map(k=>saveEntity(k))]);
  await refreshCapFlags();
}

async function archiveYearFlow(purge){
  const sel = document.getElementById('archiveEfySelect');
  const efy = sel ? parseInt(sel.value,10) : currentEFY()-1;
  if(!efy || isNaN(efy)){ say('Choose a fiscal year to archive.'); return; }
  const cutoff = fyRange(efy)[1];
  if(purge){
    if(!ask('This will:\n1) Download an archive of all transactions up to '+cutoff+' (end of '+efy+' EFY)\n2) REMOVE those transactions from this device\n3) Reset each livestock batch opening qty to the stock level on that date\n\nCustomers, assets and batches stay. Continue?')) return;
    if(!ask('Final confirmation: remove archived data from this device? Keep the downloaded file safe — this cannot be undone otherwise.')) return;
    exportYearArchive(efy);
    await purgeArchivedYear(efy);
    render();
    showToast('Archived through '+efy+' EFY and removed from this device');
  }else{
    exportYearArchive(efy);
  }
}

async function importBackupFile(file){
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('Not a valid backup file');
  }catch(e){
    say('Could not read that file. Make sure it is a Green Horizon Farm backup (.json) file.');
    return;
  }
  if(!ask('Import this backup? This will replace ALL current data in the app with the contents of this file.')) return;
  state.setup = data.setup || state.setup;
  state.calc = data.calc || state.calc;
  ENTITY_KEYS.forEach(k=>{ state[k] = Array.isArray(data[k]) ? data[k] : []; });
  await Promise.all([saveSetup(), saveCalc(), ...ENTITY_KEYS.map(saveEntity)]);
  await refreshCapFlags();
  render();
  showToast('Backup imported');
}

/* ---------------- Event wiring per render ---------------- */
function attachTabEvents(){
  const addBtnMap = {
    addReductions:'reductions', addProduction:'production',
    addProdReductions:'prodReductions', addFeedPurchases:'feedPurchases', addFeeding:'feeding',
    addIncome:'income', addExpenses:'purchase', addAssets:'assets', addVaccinations:'vaccinations', addMedications:'medications',
    addCustomers:'customers', addPayments:'payments', addComments:'comments', addInquiries:'inquiries', addAcct:'acct'
  };
  Object.keys(addBtnMap).forEach(btnId=>{
    const el = document.getElementById(btnId);
    if(el) el.addEventListener('click', ()=>openForm(addBtnMap[btnId], null));
  });

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>openForm(btn.dataset.edit, btn.dataset.id));
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>deleteRecord(btn.dataset.del, btn.dataset.id));
  });

  // Health sub-toggle
  const tVax = document.getElementById('toggleVax');
  const tMed = document.getElementById('toggleMed');
  if(tVax) tVax.addEventListener('click', ()=>{ healthSubTab='vaccinations'; render(); });
  if(tMed) tMed.addEventListener('click', ()=>{ healthSubTab='medications'; render(); });

  // Reports year selector
  const yearSel = document.getElementById('reportsYearSelect');
  if(yearSel) yearSel.addEventListener('change', (e)=>{ reportsYear = parseInt(e.target.value,10); render(); });

  // Setup add/remove
  document.querySelectorAll('[data-add-setup]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.addSetup;
      const input = document.querySelector(`[data-setup-input="${key}"]`);
      const val = (input.value||'').trim();
      if(!val) return;
      if(state.setup[key].includes(val)){ showToast('Already in list'); return; }
      state.setup[key].push(val);
      await saveSetup();
      render();
      showToast('Added');
    });
  });
  document.querySelectorAll('[data-remove-setup]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.removeSetup, val = btn.dataset.value;
      if(!ask(`Remove "${val}" from ${key}? Existing records keep this value, but it won't appear as an option anymore.`)) return;
      state.setup[key] = state.setup[key].filter(v=>v!==val);
      await saveSetup();
      render();
      showToast('Removed');
    });
  });

  // Backup / Restore
  const exportBtn = document.getElementById('exportBackupBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  const importBtn = document.getElementById('importBackupBtn');
  const importInput = document.getElementById('importFileInput');
  if(importBtn && importInput){
    importBtn.addEventListener('click', ()=>importInput.click());
    importInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) importBackupFile(file);
      importInput.value = '';
    });
  }
  // Archive old years
  const archExp = document.getElementById('archiveExportBtn');
  if(archExp) archExp.addEventListener('click', ()=>archiveYearFlow(false));
  const archPurge = document.getElementById('archivePurgeBtn');
  if(archPurge) archPurge.addEventListener('click', ()=>archiveYearFlow(true));

  // Google Drive sync
  const saveClientIdBtn = document.getElementById('saveDriveClientId');
  if(saveClientIdBtn) saveClientIdBtn.addEventListener('click', ()=>{
    const input = document.getElementById('driveClientIdInput');
    const val = (input.value||'').trim();
    if(!val){ showToast('Paste a Client ID first'); return; }
    driveConfig.clientId = val;
    saveDriveConfigLocal();
    render();
  });
  const changeIdBtn = document.getElementById('changeDriveClientId');
  if(changeIdBtn) changeIdBtn.addEventListener('click', ()=>{
    if(!ask('Change Client ID? You will need to reconnect.')) return;
    driveConfig.clientId=''; driveConfig.fileId=null;
    driveRuntime.connected=false; driveRuntime.accessToken=null; driveRuntime.tokenClient=null;
    saveDriveConfigLocal();
    render();
  });
  const connectBtn = document.getElementById('driveConnect');
  if(connectBtn) connectBtn.addEventListener('click', connectDrive);
  const syncNowBtn = document.getElementById('driveSyncNow');
  if(syncNowBtn) syncNowBtn.addEventListener('click', syncNow);
  const disconnectBtn = document.getElementById('driveDisconnect');
  if(disconnectBtn) disconnectBtn.addEventListener('click', disconnectDrive);
  const autoSyncCb = document.getElementById('driveAutoSync');
  if(autoSyncCb) autoSyncCb.addEventListener('change', (e)=>{
    driveConfig.autoSync = e.target.checked;
    saveDriveConfigLocal();
    showToast(driveConfig.autoSync ? 'Auto-sync enabled' : 'Auto-sync disabled');
  });

  // Danger zone
  const clearBtn = document.getElementById('clearAllData');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    if(!ask('This will permanently delete ALL livestock, production, feed, income/expense and health records. Continue?')) return;
    if(!ask('Are you absolutely sure? This cannot be undone.')) return;
    ENTITY_KEYS.forEach(k=>state[k]=[]);
    await Promise.all(ENTITY_KEYS.map(saveEntity));
    render();
    showToast('All farm data cleared');
  });

  const ownerInput = document.getElementById('acctOwnerName');
  if(ownerInput) ownerInput.addEventListener('change', async (e)=>{
    if(!state.setup.acctOpts) state.setup.acctOpts = {};
    state.setup.acctOpts.ownerName = e.target.value.trim();
    await saveSetup(); render();
  });
  const invToggle = document.getElementById('acctInvToggle');
  if(invToggle) invToggle.addEventListener('change', async (e)=>{
    if(!state.setup.acctOpts) state.setup.acctOpts = {};
    state.setup.acctOpts.feedInventory = e.target.checked;
    await saveSetup(); render();
  });

  document.querySelectorAll('[data-produce-price]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      if(!state.setup.produceValues) state.setup.produceValues = {};
      state.setup.produceValues[el.dataset.producePrice] = num(el.value);
      await saveSetup();
      render();
    });
  });

  if(currentTab==='reports') attachReportEvents();
  if(currentTab==='calculator') attachCalculatorEvents();
}

initApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* offline caching unavailable, app still works */ });
  });
}

name: Backup to Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      # We exclude the generated zip file from zipping itself
      # and exclude structural config folders (.git, .github)
      # to keep the backup lean.
      # Exclude any other heavy temporary or app-specific directories if needed.
      - name: Zip the repo
        run: |
          zip -r "backup-$(date +%Y-%m-%d_%H-%M).zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "backup-*.zip"

      - name: Upload to Google Drive
        env:
          # Automatically spins up a temporary rclone remote named 'gdrive_service'
          RCLONE_CONFIG_GDRIVE_SERVICE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_SCOPE: drive
          # Pass the raw JSON string from your repository secrets
          RCLONE_CONFIG_GDRIVE_SERVICE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          # The target folder variable setup in your secrets
          TARGET_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
        run: |
          # Use 'rclone copy' to drop the generated zip archive directly into your target folder
          # The suffix :${TARGET_FOLDER} routes it into the shared directory context
          rclone copy backup-*.zip gdrive_service:${TARGET_FOLDER} -v
